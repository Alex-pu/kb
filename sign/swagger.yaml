      description: "Get a list of all the products. The implementations should support various filter criteria and must support pagination. non-anonymous, super-admin and admin users"
      operationId: getItems
      security:
        - auth: []
      produces:
        - application/json
      parameters:
        - in: header
          name: Authorization
          description: "Basic Authorization"
          required: true
          type: string
          format: string
        - in: query
          name: name
          description: "The user's name must be url encoded, case insensitive, firstName or lastName. The implementations must not match the name exactly and must use regular expressions instead"
          type: string
          format: string
        - in: query
          name: page
          description: "The page 0 based indexing. Assume 0 by default if null"
          type: number
          format: integer
        - in: query
          name: limit
          description: "The maximum no of results to return. Assume 10 by default if null"
          type: number
          format: integer
        - in: query
          name: sort
          description: "The sort by keyname, if implementations doesn't support sorting by the provided key, implementations must return 400 with proper error message and error code"
          type: string
          format: string
        - in: query
          name: order
          description: "The sort order, must be asc or desc"
          type: string
          format: string
      responses:
        "200":
          description: "successful operation"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessDetail"
              - type: object
                properties:
                  data:
                    type: array
