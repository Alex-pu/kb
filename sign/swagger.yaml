      produces:
        - application/json
      parameters:
        - in: header
          name: Authorization
          type: string
          format: string
          required: true
        - in: body
          name: body
          description: "request payload to create a item"
          required: true
          schema:
            $ref: "#/definitions/ItemReq"
      responses:
        "200":
          description: "successful operation"
          schema:
            $ref: "#/definitions/SuccessDetail"
        "400":
          description: "the validation failed, client request is invalid"
          schema:
            $ref: "#/definitions/ErrorDetail"
        "401":
          description: "invalid username or password"
          schema:
            $ref: "#/definitions/ErrorDetail"
        "404":
          description: "user not found with specified email"
          schema:
            $ref: '#/definitions/ErrorDetail'
