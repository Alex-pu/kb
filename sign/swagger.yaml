  # complex objects have schema definitions
definitions:
  ErrorDetail:
    type: object
    required:
      - message
      - status
      - statusCode
    properties:
      status:
        type: number
        format: integer
        enum: [400, 401, 404, 500, 502, 504]
        description: "the status for future reference"
      statusCode:
        type: string
        description: "the error code for future reference"
      message:
        type: string
        description: "the detailed description/cause of the error"
  SuccessDetail:
    type: object
    required:
      - status
      - message
      - statusCode
    properties:
      status:
        type: number
        format: integer
        enum: [200, 204,202]
        description: "the status for future reference"
      statusCode:
        type: string
        description: "the success code for future reference"
      message:
        type: string
        description: "the detailed messages"
  UserLoginReq:
    type: object
    required:
      - password
      - username
    properties:
      password:
        type: string
        description: "the password"
      username:
        type: string
        description: "the username"
  LoginRes:
    type: object
    required:
      - accessToken
    properties:
      # the access token
      accessToken:
        type: string
        description: "the access token that can be used as Authorization header"
  ItemReq:
    type: object
    required:
      - name
      - orgCountryCode
      - unitPrice
      - itemTypeCode
      - qtyUnitCode
      - pkgUnitCode
      - taxCode
      - itemClassCode
    properties:
      name:
        type: string
        format: string
        description: "Item's name e.g. xyz"
      orgCountryCode:
        type: string
        format: string
        description: "Item code of country of origin, see List from /countries endpoint"
      unitPrice:
        type: number
        format: double
        description: "Item unit price"
      itemTypeCode:
        type: string
        format: string
        enum: ["1","2","3"]
        description: "Type of the item, ie 1 -> Raw material, 2 -> Product, 3 -> Service"
      taxCode:
        type: string
        format: string
        enum: ["A","B","C", "D", "E"]
        description: "Tax department of the item, ie A-Exempt, B-16.00%, C-0%, D-Non VAT, E-8.00%"
      qtyUnitCode:
        type: string
        format: string
        description: "Code of Quantity unit measures of the item, eg KG"
      pkgUnitCode:
        type: string
        format: string
        description: "Code of Package of the item"
      itemClassCode:
        type: string
        format: string
        description: "Classification code of the item"
      initialStock:
        type: number
        format: double
        description: "Item initial stock"
  ItemUpdateReq:
    type: object
    required:
