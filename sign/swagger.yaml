        type: string
        format: string
        description: "Trader sale's original invoice number, for sales returns. For non credit note sales omit this property"
      totalAmount:
        type: number
        format: double
        description: "sale's total amount"
      paymentType:
        type: string
        format: string
        enum: ["01","02","03","04","05","06","07"]
        description: 'Payment type opted by the customer i.e 01 -> cash, 02 -> credit, 03 -> cash/credit, 04 -> cheque, 05 -> dcard & ccard, 06 -> mobile money And 07 -> Other'
      salesTypeCode:
        type: string
        format: string
        enum: ["C","N","P","T"]
        description: 'Sales Type code i.e C -> Copy, N -> Normal, P -> Proforma, T -> Training'
      receiptTypeCode:
        type: string
        format: string
        enum: ["S","R"]
        description: 'Sales receipt Type code i.e S -> Sale and R -> Credit Note'
      salesStatusCode:
        type: string
        format: string
        enum: ["01","02","03","04","05","06"]
        description: 'Sales transaction status code i.e 01 -> Wait for Approval, 02 -> Approved, 03 -> Credit Note Requested, 04 -> Canceled, 05 -> Credit Note Generated and 06 -> Transferred'
      salesDate:
        type: string
        pattern: '^\d{4}\d{2}\d{2}\d{2}\d{2}\d{2}$'
        example: '20240509050115'
        description: 'Sales date with format YYYYMMDDhhmmss {4 digits for year, 2 digits for month, 2 digits for day, 2 digits for hour(12 based hour system), 2 digits for minutes and 2 digits for seconds}'
      currency:
        type: string
        format: string
        description: 'sales currency'
      exchangeRate:
        type: number
        format: double
        description: "sale's currency exchange rate"
