swagger: "2.0"
info:
  version: "1.0.0"
  title: VFD REST API
  description: "SCU MODULE -VIRTUAL FD REST SERVICES"

host: "127.0.0.1:8888"
basePath: /api/v1/
#
schemes:
  - http
  - https

securityDefinitions:
  auth:
    type: basic

paths:
  /users/auth:
    x-swagger-router-controller: UserController
    post:
      description: login users
      operationId: auth
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          description: "request payload to sign a user"
          required: true
          schema:
            $ref: "#/definitions/UserLoginReq"
      responses:
        "200":
          description: "access token and refresh token"
          schema:
            $ref: "#/definitions/LoginRes"
        "400":
          description: "the validation failed, client request is invalid"
          schema:
            $ref: "#/definitions/ErrorDetail"
        "401":
          description: "invalid username or password"
          schema:
            $ref: "#/definitions/ErrorDetail"
        "404":
          description: "user not found with specified email"
          schema:
            $ref: '#/definitions/ErrorDetail'
  /items:
